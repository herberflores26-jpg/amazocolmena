<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amazocolmena · Trazabilidad de tu miel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<style>
:root{--bg:#f3eee2;--card:#fbf8f0;--ink:#16382b;--green:#0f5a3c;--gold:#a8832c;--line:#d9cfb5;--muted:#5d6b62;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c16;--card:#15281f;--ink:#efe8d6;--green:#6fcf9f;--gold:#d8b45a;--line:#2d4a3c;--muted:#a3b3a9}}
:root[data-theme="dark"]{--bg:#0e1c16;--card:#15281f;--ink:#efe8d6;--green:#6fcf9f;--gold:#d8b45a;--line:#2d4a3c;--muted:#a3b3a9}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lato,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 20px 40px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif}
.brand{text-align:center;color:var(--green);font:700 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.12em}
.brand small{display:block;color:var(--gold);font:400 13px Lato,sans-serif;letter-spacing:.2em;margin-top:2px}
.badge{width:150px;height:170px;margin:26px auto 14px;display:grid;place-items:center;
clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,var(--gold),var(--green))}
.badge span{width:140px;height:160px;display:grid;place-items:center;background:var(--card);color:var(--green);
clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:700 54px "Cormorant Garamond",Georgia,serif}
.lead{text-align:center;color:var(--muted);margin:0}
h1{text-align:center;font-size:40px;line-height:1.1;margin:4px 0 6px;color:var(--ink)}
.where{text-align:center;color:var(--gold);font-weight:700;margin:0 0 22px}
.ok{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin:0 auto 24px;width:fit-content;font-size:14px;color:var(--green);font-weight:700}
.ok i{width:10px;height:10px;border-radius:50%;background:var(--green)}
blockquote{margin:0 0 26px;padding:0 0 0 16px;border-left:3px solid var(--gold);font:600 21px/1.35 "Cormorant Garamond",Georgia,serif}
dl{margin:0 0 26px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}dt{color:var(--muted)}dd{margin:0;font-weight:700;text-align:right}
h2{font-size:26px;margin:0 0 12px}
ol{list-style:none;margin:0 0 26px;padding:0 0 0 22px;border-left:2px solid var(--line)}
ol li{position:relative;padding:0 0 16px}
ol li::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
ol b{display:block}ol span{color:var(--muted);font-size:14px}
.pick{border-top:1px solid var(--line);padding-top:18px;text-align:center;color:var(--muted);font-size:14px}
.pick a{display:inline-block;margin:6px 4px 0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--green);text-decoration:none;font-weight:700}
.pick a[aria-current]{background:var(--green);color:var(--bg);border-color:var(--green)}
.pick a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:12px;margin-top:14px}
</style>
</head>
<body>
<main>
  <div class="brand">AMAZOCOLMENA<small>APIARIO AMAZÓNICO</small></div>
  <div class="badge"><span id="ini"></span></div>
  <p class="lead">Tu miel fue cosechada por</p>
  <h1 id="nombre"></h1>
  <p class="where" id="lugar"></p>
  <div class="ok"><i></i>Lote verificado · <span id="lote"></span></div>
  <blockquote id="frase"></blockquote>
  <dl id="datos"></dl>
  <h2>El camino de tu frasco</h2>
  <ol id="ruta"></ol>
  <div class="pick">Simular el escaneo de otro lote<br><span id="lotes"></span>
    <p class="note">Datos de ejemplo para la demostración.</p></div>
</main>
<script>
var L={
"lote-001":{n:"Familia Quispe Huamaní",u:"Huanta, Ayacucho",f:"“Cuidamos cada colmena como parte de la familia. Si el bosque vive, nosotros vivimos.”",d:[["Abeja","Melipona (sin aguijón)"],["Cosecha","12 de noviembre de 2026"],["Colmenas del apiario","20"],["Flora principal","Achiote y sangre de grado"],["Presentación","Gotero medicinal 30 ml"]],r:[["Cosecha en colmena","12 nov · Apiario de la familia Quispe"],["Filtrado y envasado","15 nov · Planta de envasado, Ayacucho"],["Control de pureza","18 nov · Sin azúcar añadida"],["Código QR asignado","20 nov · Listo para venta"]]},
"lote-002":{n:"Familia Ccente Rojas",u:"La Mar, Ayacucho",f:"“Antes talábamos para sobrevivir. Hoy la miel nos permite proteger el monte.”",d:[["Abeja","Melipona (sin aguijón)"],["Cosecha","18 de noviembre de 2026"],["Colmenas del apiario","20"],["Flora principal","Flores nativas del VRAEM"],["Presentación","Frasco gourmet 100 g"]],r:[["Cosecha en colmena","18 nov · Apiario de la familia Ccente"],["Filtrado y envasado","21 nov · Planta de envasado, Ayacucho"],["Control de pureza","23 nov · Sin azúcar añadida"],["Código QR asignado","25 nov · Listo para venta"]]},
"lote-003":{n:"Familia Anyosa Pérez",u:"Huanta, Ayacucho",f:"“La miel de meliponas no se cristaliza: es un tesoro que dura años.”",d:[["Abeja","Melipona (sin aguijón)"],["Cosecha","22 de noviembre de 2026"],["Colmenas del apiario","20"],["Flora principal","Achiote"],["Presentación","Frasco familiar 250 g"]],r:[["Cosecha en colmena","22 nov · Apiario de la familia Anyosa"],["Filtrado y envasado","24 nov · Planta de envasado, Ayacucho"],["Control de pureza","26 nov · Sin azúcar añadida"],["Código QR asignado","27 nov · Listo para venta"]]}
};
function show(){
  var k=(location.hash||"").slice(1); if(!L[k]) k="lote-001";
  var o=L[k], w=o.n.split(" ");
  document.getElementById("ini").textContent=(w[1]||w[0]).charAt(0)+(w[2]||"").charAt(0);
  document.getElementById("nombre").textContent=o.n;
  document.getElementById("lugar").textContent=o.u;
  document.getElementById("lote").textContent=k.replace("lote-","Lote ");
  document.getElementById("frase").textContent=o.f;
  document.getElementById("datos").innerHTML=o.d.map(function(x){return "<div><dt>"+x[0]+"</dt><dd>"+x[1]+"</dd></div>"}).join("");
  document.getElementById("ruta").innerHTML=o.r.map(function(x){return "<li><b>"+x[0]+"</b><span>"+x[1]+"</span></li>"}).join("");
  document.getElementById("lotes").innerHTML=Object.keys(L).map(function(id){return '<a href="#'+id+'"'+(id===k?' aria-current="true"':'')+'>'+id.replace("lote-","Lote ")+'</a>'}).join("");
  document.title="Amazocolmena · "+o.n;
}
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
